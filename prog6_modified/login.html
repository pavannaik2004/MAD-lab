<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="manifest" href="./manifest.json" />
  </head>
  <body
    style="
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    "
  >
    <script>
      localStorage.setItem("username", "rvce");
      localStorage.setItem("passme1", "rvce");

      function verify() {
        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;
        let un = localStorage.getItem("username");
        let pas = localStorage.getItem("passme1");
        if (un === username && pas === password) {
          // Set authenticated flag
          localStorage.setItem("isAuthenticated", "true");
          localStorage.setItem("loggedInUser", username);
          alert("Authentication successful!");
          // Redirect to stock website
          window.location.href = "index.html";
        } else {
          alert("Authentication failed. Invalid credentials!");
        }
      }
    </script>
    <h2>Username: <input type="text" name="username" id="username" /></h2>
    <h2>Password: <input type="password" name="password" id="password" /></h2>
    <h4><input type="submit" value="check" onclick="verify()" /></h4>
    inside the html page with manifest
  </body>
</html>
