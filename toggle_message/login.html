<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RV Institutions | Secure Network Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy-primary: #0b1f3a;
        --navy-secondary: #132f57;
        --navy-accent: #1f4e8c;
        --light-bg: #f2f5f9;
        --border: #e5eaf2;
        --text-dark: #1f2937;
        --text-muted: #6b7280;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          "Roboto",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: linear-gradient(135deg, #0b1f3a, #132f57);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: var(--text-dark);
      }
      /* Card */
      .login-card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        overflow: hidden;
      }
      /* Header */
      .login-header {
        background: linear-gradient(
          135deg,
          var(--navy-primary),
          var(--navy-secondary)
        );
        padding: 30px 24px;
        text-align: center;
        color: #ffffff;
      }
      .logo {
        height: 55px;
        background: url(/XX/YY/ZZ/CI/CHGHDGFG) no-repeat center;
        background-size: contain;
        margin-bottom: 14px;
      }
      .login-header h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .login-header p {
        margin: 6px 0 0;
        font-size: 13px;
        opacity: 0.85;
      }
      /* Body */
      .login-body {
        padding: 30px;
        background: #ffffff;
      }
      .secure-label {
        font-size: 12px;
        color: var(--text-muted);
        text-align: center;
        margin-bottom: 22px;
      }
      .form-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.2s ease;
      }
      input:focus {
        border-color: var(--navy-accent);
        outline: none;
        box-shadow: 0 0 0 3px rgba(31, 78, 140, 0.15);
      }
      /* Button */
      button {
        width: 100%;
        padding: 12px;
        background: var(--navy-accent);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.2s ease,
          transform 0.1s ease;
      }
      button:hover {
        background: #163e73;
      }
      button:active {
        transform: scale(0.98);
      }
      /* Footer */
      .login-footer {
        font-size: 11px;
        color: var(--text-muted);
        text-align: center;
        padding: 18px;
        border-top: 1px solid var(--border);
        background: #f9fbfd;
      }
      .login-footer strong {
        color: var(--navy-primary);
      }
      @media (max-width: 480px) {
        .login-body {
          padding: 22px;
        }
      }
    </style>
    <div id="uuidMachine">efd6f09c-4691-4b5d-92e7-0053f1dc45d3</div>
    <div id="uuidMachine">edd7499c-2bc9-410c-853e-f29c50ac64c9</div>
  </head>
  <body>
    <div class="login-card">
      <div class="login-header">
        <div class="logo"></div>
        <h1>RV Institutions</h1>
        <p>Secure Internet Access Gateway</p>
      </div>
      <div class="login-body">
        <div class="secure-label">
          🔒 Authentication is required to access the Internet.
        </div>
        <form action="/" method="post">
          <input
            type="hidden"
            name="4Tredir"
            value="http://detectportal.brave-http-only.com/"
          />
          <input type="hidden" name="magic" value="07189821ea9df7ee" />
          <input type="hidden" name="" value="" />
          <div class="form-group">
            <label for="ft_un">Institution Username</label>
            <input
              name="username"
              id="ft_un"
              type="text"
              required=""
              autocorrect="off"
              autocapitalize="off"
              autocomplete="username"
            />
          </div>
          <div class="form-group">
            <label for="ft_pd">Password</label>
            <input
              name="password"
              id="ft_pd"
              type="password"
              required=""
              autocomplete="current-password"
            />
          </div>
          <button type="submit">Sign In</button>
        </form>
      </div>
      <div class="login-footer">
        © 2026 <strong>RV Institutions</strong> • IT Services Department
        <br />
        Unauthorized access is prohibited and monitored.
      </div>
    </div>
  </body>
</html>
